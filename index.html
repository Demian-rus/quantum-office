</style></head><body><div id="app"></div><script>/** MVP spreadsheet engine. Never evaluates JavaScript from user cells. */
function colLabel(n) {
  let result = '';
  for (let x = n + 1; x > 0; x = Math.floor((x - 1) / 26)) result = String.fromCharCode(65 + ((x - 1) % 26)) + result;
  return result;
}

function cellName(row, col) { return `${colLabel(col)}${row + 1}`; }

function parseCell(ref) {
  const match = /^([A-Z]+)([1-9]\d*)$/.exec(ref.toUpperCase());
  if (!match) return null;
  let col = 0;
  for (const letter of match[1]) col = col * 26 + letter.charCodeAt(0) - 64;
  return { row: Number(match[2]) - 1, col: col - 1 };
}

function tokenise(str) {
  const text = str.toUpperCase().replace(/\s+/g, '');
  const regex = /(?:\d+(?:\.\d+)?|\.[0-9]+)|[A-Z]+[1-9]\d*|[A-Z]+|[()+\-*/,:]/gy;
  const tokens = [];
  let offset = 0;
  while (offset < text.length) {
    regex.lastIndex = offset;
    const m = regex.exec(text);
    if (!m) throw new Error('Invalid formula');
    tokens.push(m[0]);
    offset = regex.lastIndex;
    if (tokens.length > 2000) throw new Error('Formula too long');
  }
  return tokens;
}

function rangeRefs(start, end) {
  const a = parseCell(start), b = parseCell(end);
  if (!a || !b) throw new Error('Invalid range');
  const count = (Math.abs(a.row-b.row)+1) * (Math.abs(a.col-b.col)+1);
  if (count > 10000) throw new Error('Range too large');
  const refs = [];
  for (let row=Math.min(a.row,b.row);row<=Math.max(a.row,b.row);row++)
    for (let col=Math.min(a.col,b.col);col<=Math.max(a.col,b.col);col++) refs.push(cellName(row,col));
  return refs;
}

function evaluateCell(ref, cells, visiting = new Set()) {
  if (visiting.has(ref)) return '#CYCLE!';
  const raw = String(cells[ref] ?? '');
  if (!raw.startsWith('=')) return raw;
  const next = new Set(visiting); next.add(ref);
  let tokens;
  try { tokens = tokenise(raw.slice(1)); } catch { return '#ERROR!'; }
  let i = 0;
  function peek() { return tokens[i]; }
  function eat(x) { if (peek() === x) { i++; return true; } return false; }
  function numeric(r) {
    const v = evaluateCell(r, cells, next);
    if (typeof v === 'string' && v.startsWith('#')) throw new Error(v);
    if (v === '') return 0;
    const n = Number(v);
    if (!Number.isFinite(n)) throw new Error('#VALUE!');
    return n;
  }
  function expression() {
    let n = term();
    while (peek() === '+' || peek() === '-') {
      const op = tokens[i++]; const rhs = term(); n = op === '+' ? n+rhs : n-rhs;
    }
    return n;
  }
  function term() {
    let n = factor();
    while (peek() === '*' || peek() === '/') {
      const op = tokens[i++]; const rhs = factor();
      if (op === '/' && rhs === 0) throw new Error('#DIV/0!');
      n = op === '*' ? n*rhs : n/rhs;
    }
    return n;
  }
  function factor() {
    if (eat('-')) return -factor();
    if (eat('+')) return factor();
    if (eat('(')) { const v=expression(); if (!eat(')')) throw new Error('#ERROR!'); return v; }
    const token = tokens[i++];
    if (!token) throw new Error('#ERROR!');
    if (/^(?:\d|\.)/.test(token)) return Number(token);
    if (/^[A-Z]+[1-9]\d*$/.test(token)) return numeric(token);
    if (/^[A-Z]+$/.test(token)) {
      if (!['SUM','AVERAGE','MIN','MAX','COUNT'].includes(token) || !eat('(')) throw new Error('#NAME?');
      const vals = [];
      if (!eat(')')) {
        do {
          if (/^[A-Z]+[1-9]\d*$/.test(peek()||'') && tokens[i+1] === ':') {
            const first=tokens[i++]; i++;
            const last=tokens[i++];
            for (const r of rangeRefs(first,last)) vals.push(numeric(r));
          } else vals.push(expression());
        } while (eat(','));
        if (!eat(')')) throw new Error('#ERROR!');
      }
      if (token === 'SUM') return vals.reduce((a,b)=>a+b,0);
      if (token === 'COUNT') return vals.length;
      if (token === 'AVERAGE') return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      if (token === 'MIN') return vals.length ? Math.min(...vals) : 0;
      return vals.length ? Math.max(...vals) : 0;
    }
    throw new Error('#ERROR!');
  }
  try {
    const result=expression();
    if (i !== tokens.length || !Number.isFinite(result)) return '#ERROR!';
    return Math.round((result + Number.EPSILON) * 1e10) / 1e10;
  } catch (e) {
    return e.message?.startsWith('#') ? e.message : '#ERROR!';
  }
}

function csvEncode(grid) {
  return grid.map(row=>row.map(value=>{
    const s=String(value ?? '');
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\r\n');
}

function csvDecode(input) {
  const rows=[], row=[]; let cell='', quoted=false;
  for(let i=0;i<input.length;i++){
    const ch=input[i];
    if (quoted) {
      if(ch==='"'&&input[i+1]==='"'){cell+='"';i++;}
      else if(ch==='"')quoted=false;
      else cell+=ch;
    } else if(ch==='"' && cell==='') quoted=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&input[i+1]==='\n')i++;
      row.push(cell);rows.push([...row]);row.length=0;cell='';
    } else cell+=ch;
  }
  if(quoted)throw new Error('Unclosed CSV quote');
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}



const uid=()=>globalThis.crypto?.randomUUID?.()??`q-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const stamp=()=>new Date().toISOString();
const LIMITS={rows:2000,columns:100,cells:50000,sheets:25};
function newSheet(name='Лист 1') {return {id:uid(),name,cells:{}};}
function newWorkbook(name='Новая таблица') {const sheet=newSheet();return {id:uid(),type:'sheet',name,created:stamp(),updated:stamp(),sheets:[sheet],activeSheetId:sheet.id};}
function currentSheet(book){return book.sheets.find(s=>s.id===book.activeSheetId)||book.sheets[0];}
function getCell(sheet,ref){return sheet.cells[String(ref).toUpperCase()]||{value:'',style:{}};}
function setCell(sheet,ref,value){if(!validRef(ref))throw Error('Адрес ячейки вне диапазона');const key=ref.toUpperCase();if(!sheet.cells[key])sheet.cells[key]={value:'',style:{}};sheet.cells[key].value=String(value??'').slice(0,50000);if(!sheet.cells[key].value&&!Object.keys(sheet.cells[key].style||{}).length)delete sheet.cells[key];}
function setStyle(sheet,ref,patch){if(!validRef(ref))throw Error('Недопустимая ячейка');const key=ref.toUpperCase();const prev=getCell(sheet,key);sheet.cells[key]={value:prev.value,style:{...prev.style,...patch}};}
function validRef(ref){const p=parseCell(String(ref));return !!p&&p.row<LIMITS.rows&&p.col<LIMITS.columns;}
function refsBetween(a,b){const p=parseCell(a),q=parseCell(b);if(!p||!q)return [];const refs=[];for(let r=Math.min(p.row,q.row);r<=Math.max(p.row,q.row);r++)for(let c=Math.min(p.col,q.col);c<=Math.max(p.col,q.col);c++)if(r<LIMITS.rows&&c<LIMITS.columns)refs.push(cellName(r,c));return refs;}
function rectangle(a,b){const p=parseCell(a),q=parseCell(b);return p&&q?{r1:Math.min(p.row,q.row),r2:Math.max(p.row,q.row),c1:Math.min(p.col,q.col),c2:Math.max(p.col,q.col)}:null;}
function rawMap(sheet){return Object.fromEntries(Object.entries(sheet.cells).map(([k,v])=>[k,v.value]));}
function resultOf(sheet,ref,map=rawMap(sheet)){return evaluateCell(ref,map);}
function displayedValue(sheet,ref,map=rawMap(sheet)){
  const cell=getCell(sheet,ref),result=resultOf(sheet,ref,map);if(result===''||result==null)return '';
  if(typeof result!=='number')return String(result);
  const n=Number.isFinite(result)?result:0;
  if(cell.style?.format==='currency')return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(n);
  if(cell.style?.format==='percent')return new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:2}).format(n);
  if(cell.style?.format==='integer')return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n);
  return String(n);
}
function valuesTSV(sheet,a,b){const rect=rectangle(a,b);if(!rect)return '';
 const map=rawMap(sheet),rows=[];for(let r=rect.r1;r<=rect.r2;r++){const row=[];for(let c=rect.c1;c<=rect.c2;c++)row.push(String(resultOf(sheet,cellName(r,c),map)));rows.push(row.join('\t'));}return rows.join('\n');}
function pasteTSV(sheet,start,text){const at=parseCell(start);if(!at||!validRef(start))throw Error('Недопустимая ячейка');
 const rows=String(text).replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(line=>line.split('\t'));
 const maxR=Math.min(LIMITS.rows-at.row,rows.length),maxC=Math.min(LIMITS.columns-at.col,Math.max(...rows.map(r=>r.length)));
 if(maxR*maxC>20000)throw Error('Вставка ограничена 20 000 ячеек');
 for(let r=0;r<maxR;r++)for(let c=0;c<Math.min(maxC,rows[r].length);c++)setCell(sheet,cellName(at.row+r,at.col+c),rows[r][c]);

}

}

function validateWorkbook(book){
 if(!book||book.type!=='sheet'||typeof book.id!=='string'||typeof book.name!=='string'||book.name.length>200||!Array.isArray(book.sheets)||!book.sheets.length||book.sheets.length>LIMITS.sheets)throw Error('Неверный формат книги');
 let total=0;const ids=new Set();for(const sheet of book.sheets){if(!sheet||typeof sheet.id!=='string'||ids.has(sheet.id)||typeof sheet.name!=='string'||sheet.name.length>100||!sheet.cells||typeof sheet.cells!=='object'||Array.isArray(sheet.cells))throw Error('Повреждённый лист');ids.add(sheet.id);const keys=Object.keys(sheet.cells);total+=keys.length;for(const ref of keys){const cell=sheet.cells[ref];if(!validRef(ref)||!cell||typeof cell.value!=='string'||cell.value.length>50000||!cell.style||typeof cell.style!=='object'||Array.isArray(cell.style))throw Error('Повреждённая ячейка');
    const style=cell.style;
    if(Object.keys(style).some(k=>!['bold','italic','bg','color','align','format'].includes(k))||
       ['bold','italic'].some(k=>k in style&&typeof style[k]!=='boolean')||
       ['bg','color'].some(k=>k in style&&!/^#[0-9a-fA-F]{6}$/.test(style[k]))||
       ('align' in style&&!['left','center','right'].includes(style.align))||
       ('format' in style&&!['general','currency','percent','integer'].includes(style.format)))throw Error('Недопустимое оформление ячейки');}}
 if(total>LIMITS.cells)throw Error('Превышен лимит ячеек');if(!ids.has(book.activeSheetId))book.activeSheetId=book.sheets[0].id;return book;
}

const STORE_KEY='quantum-office.workspace.v3';
const PREVIOUS_KEY='quantum-office.workspace.v3.previous';
const blank=()=>({version:3,books:[],active:null});
function validateWorkspace(data){if(!data||data.version!==3||!Array.isArray(data.books)||data.books.length>300)throw Error('Некорректный архив Quantum Office');const seen=new Set();for(const book of data.books){validateWorkbook(book);if(seen.has(book.id))throw Error('Повторяющийся документ');seen.add(book.id);}return data;}
function loadWorkspace(storage=globalThis.localStorage){for(const key of [STORE_KEY,PREVIOUS_KEY]){try{const raw=storage.getItem(key);if(raw)return validateWorkspace(JSON.parse(raw));}catch{continue;}}return blank();}
function saveWorkspace(data,storage=globalThis.localStorage){validateWorkspace(data);const existing=storage.getItem(STORE_KEY);if(existing&&existing!==JSON.stringify(data)){try{storage.setItem(PREVIOUS_KEY,existing);}catch{ /* previous copy is best effort */ }}storage.setItem(STORE_KEY,JSON.stringify(data));}
function newWorkspace(){return blank();}
function encodeBook(book){validateWorkbook(book);return JSON.stringify({format:'quantum-office-book-v1',book},null,2);}
function decodeBook(raw){const value=JSON.parse(raw);if(value?.format!=='quantum-office-book-v1')throw Error('Неподдерживаемый формат .qbook');return validateWorkbook(value.book);}
function encodeWorkspace(workspace){validateWorkspace(workspace);return JSON.stringify({format:'quantum-office-backup-v1',workspace},null,2);}
function decodeWorkspace(raw){const value=JSON.parse(raw);if(value?.format!=='quantum-office-backup-v1')throw Error('Неподдерживаемый формат резервной копии');return validateWorkspace(value.workspace);}

function persist(){try{saveWorkspace(workspace);storeWarning=false;const n=document.querySelector('#storage-indicator');if(n)n.textContent='● Автосохранено локально';}catch(e){storeWarning=true;const n=document.querySelector('#storage-indicator');if(n)n.textContent='⚠ Сохраните файл вручную';status('Память браузера недоступна: экспортируйте .qbook или архив',true);}}

function replaceBook(fromHistory,toHistory){const b=book();if(!b)return;const stack=fromHistory.get(b.id)||[];if(!stack.length)return;const replacement=stack.pop();fromHistory.set(b.id,stack);const other=toHistory.get(b.id)||[];other.push(structuredClone(b));toHistory.set(b.id,other);workspace.books[workspace.books.findIndex(x=>x.id===b.id)]=replacement;persist();render();}

async function importFile(file){if(!file)return;if(file.size>15_000_000){status('Файл больше 15 МБ не поддерживается',true);return;}try{

 if(activeRibbon==='formula')body=`<div class="ribbon-group"><span class="group-name">ФУНКЦИИ</span>${['SUM','AVERAGE','MIN','MAX','COUNT'].map(fn=>`<button data-action="formula-fn" data-fn="${fn}">${fn}</button>`).join('')}</div><div class="ribbon-note">Пример: =SUM(B2:B8) · =A1*B1 · =AVERAGE(C1:C10)</div>`;
 if(activeRibbon==='data')body=`<div class="ribbon-group"><span class="group-name">ОБМЕН ДАННЫМИ</span><button data-action="import">↑ Импорт CSV / QBOOK</button><button data-action="csv">↓ Экспорт CSV</button></div><div class="ribbon-note">CSV сохраняет только значения активного листа, без форматирования и формул.</div>`;
 if(activeRibbon==='insert')body=`<div class="ribbon-group"><span class="group-name">ЛИСТЫ</span><button data-action="sheet-add">+ Новый лист</button><button data-action="sheet-rename">Переименовать лист</button></div><div class="ribbon-note">Диаграммы и изображения появятся на следующих этапах.</div>`;
 if(activeRibbon==='view')body=`<div class="ribbon-group"><span class="group-name">НАВИГАЦИЯ</span><button data-action="goto" data-ref="A1">К A1</button><button data-action="goto" data-ref="A100">К A100</button><button data-action="goto" data-ref="Z1">К Z1</button></div><div class="ribbon-note">Виртуализованная сетка: 2 000 строк × 100 столбцов.</div>`;
 if(activeRibbon==='file')body=`<div class="ribbon-group"><span class="group-name">ФАЙЛ</span><button data-action="save">↓ Сохранить .qbook</button><button data-action="backup">↓ Архив всех файлов</button><button data-action="import">↑ Открыть файл</button><button data-action="csv">↓ CSV</button></div>`;
 return `<div class="ribbon"><div class="ribbon-tabs">${tabs.map(([id,name])=>`<button class="${activeRibbon===id?'chosen':''}" data-action="ribbon" data-target="${id}">${name}</button>`).join('')}</div><div class="ribbon-controls">${body}</div></div>`;}
function sheetpage(){const b=book(),s=sheet();return `<main class="sheet-page"><div class="work-top"><div class="work-title"><span class="work-icon">▦</span><div><input id="book-name" aria-label="Название книги" value="${esc(b.name)}" maxlength="200"><span class="work-subtitle"><span id="storage-indicator">● Автосохранено локально</span> · ${b.sheets.length} лист(ов)</span></div></div><div class="work-actions"><button class="soft-btn" data-action="import">↑ Открыть</button><button class="primary-btn" data-action="save">↓ Сохранить файл</button></div></div>${ribbon()}<div class="formula-line"><input id="name-box" aria-label="Адрес выбранной ячейки" value="${esc(activeCell)}" spellcheck="false"><div class="fx-symbol">ƒx</div><input id="formula-input" aria-label="Формула или значение" spellcheck="false" value="${esc(getCell(s,activeCell).value)}" placeholder="Значение или формула (например, =SUM(A1:A9))"></div><div id="grid-scroll" class="grid-scroll" tabindex="0" role="grid" aria-label="Лист ${esc(s.name)}"><div id="grid-canvas" class="grid-canvas"></div></div><div class="sheet-footer"><div class="sheet-tabs"><button class="sheet-menu" data-action="sheet-add" title="Добавить лист">+</button>${b.sheets.map(x=>`<button class="sheet-tab ${s.id===x.id?'selected':''}" data-action="sheet-select" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('')}<button class="sheet-options" data-action="sheet-rename" title="Переименовать текущий лист">···</button><button class="sheet-options" data-action="sheet-delete" title="Удалить лист">×</button></div><div class="sheet-status"><span id="selection-info">${esc(activeCell)}</span><span>${LIMITS.rows.toLocaleString('ru-RU')} строк × ${LIMITS.columns} столбцов</span><span>Quantum Sheets / alpha</span></div></div></main>`;}
function render(){app.innerHTML=topbar()+(page==='home'?homepage():page==='sheet'&&book()?sheetpage():placeholder(page))+`<input id="file-picker" type="file" accept=".qbook,.qbackup,.csv" hidden><div id="toast" class="toast" role="status"></div>`;
 if(page==='sheet'&&book()){const view=document.getElementById('grid-scroll');view.scrollLeft=scrollLeft;view.scrollTop=scrollTop;view.addEventListener('scroll',()=>{scrollLeft=view.scrollLeft;scrollTop=view.scrollTop;drawGrid();},{passive:true});drawGrid();}}
function drawGrid(){if(page!=='sheet'||!sheet())return;const view=document.getElementById('grid-scroll'),canvas=document.getElementById('grid-canvas');if(!view||!canvas||editing)return;
 canvas.style.width=`${rowW+LIMITS.columns*cellW}px`;canvas.style.height=`${headerH+LIMITS.rows*cellH}px`;
 const firstR=Math.max(0,Math.floor(view.scrollTop/cellH)-2),lastR=Math.min(LIMITS.rows-1,Math.ceil((view.scrollTop+view.clientHeight)/cellH)+2);
 const firstC=Math.max(0,Math.floor(view.scrollLeft/cellW)-2),lastC=Math.min(LIMITS.columns-1,Math.ceil((view.scrollLeft+view.clientWidth)/cellW)+2);
 const rect=rectangle(activeCell,rangeEnd),raw=rawMap(sheet());let html='';
 for(let r=firstR;r<=lastR;r++)for(let c=firstC;c<=lastC;c++){
 const ref=cellName(r,c),item=getCell(sheet(),ref),selected=r>=rect.r1&&r<=rect.r2&&c>=rect.c1&&c<=rect.c2,active=ref===activeCell,style=item.style||{};
 const val=displayedValue(sheet(),ref,raw);const align=style.align||(/^[-+]?\d+(\.\d+)?$/.test(val)?'right':'left');
 const appearance=`${style.bg?`background:${style.bg};`:''}${style.color?`color:${style.color};`:''}${style.bold?'font-weight:750;':''}${style.italic?'font-style:italic;':''}text-align:${align};`;
 html+=`<div class="grid-cell ${selected?'is-selected':''} ${active?'is-active':''}" data-ref="${ref}" role="gridcell" aria-selected="${selected}" style="top:${headerH+r*cellH}px;left:${rowW+c*cellW}px;width:${cellW}px;height:${cellH}px;${appearance}" title="${esc(ref)}">${esc(val)}</div>`;
 }
 for(let r=firstR;r<=lastR;r++)html+=`<div class="rowhead" style="top:${headerH+r*cellH}px;left:${scrollLeft}px;width:${rowW}px;height:${cellH}px">${r+1}</div>`;
 for(let c=firstC;c<=lastC;c++)html+=`<div class="colhead" style="top:${scrollTop}px;left:${rowW+c*cellW}px;width:${cellW}px;height:${headerH}px">${esc(cellName(0,c).replace(/\d+$/,''))}</div>`;
 html+=`<div class="corner" style="top:${scrollTop}px;left:${scrollLeft}px;width:${rowW}px;height:${headerH}px">▦</div>`;
 canvas.innerHTML=html;
}
app.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target)return;const {action,id,value,ref,fn}=target.dataset;
 switch(action){case 'route':route(target.dataset.target);break;case 'new':createBook();break;case 'example':createBook(true);break;case 'open':openBook(id);break;case 'clone':cloneBook(id);break;case 'delete':removeBook(id);break;
 case 'import':document.querySelector('#file-picker')?.click();break;case 'backup':backup();break;case 'save':await saveBook();break;
 case 'csv':if(sheet()){download(`${safeFile(book().name)}-${safeFile(sheet().name)}.csv`,'\uFEFF'+exportCSV(sheet()),'text/csv;charset=utf-8');status('CSV скачан (текущий лист)');}break;
 case 'ribbon':activeRibbon=target.dataset.target;render();break;case 'undo':undo();break;case 'redo':redo();break;case 'clear':clearSelected();break;
 case 'bold':applyStyle({bold:!getCell(sheet(),activeCell).style?.bold});break;case 'italic':applyStyle({italic:!getCell(sheet(),activeCell).style?.italic});break;case 'align':applyStyle({align:value});break;case 'format':applyStyle({format:value});break;
 case 'formula-fn':{const p=parseCell(activeCell);const from=p.row>0?cellName(0,p.col):cellName(1,p.col),to=p.row>0?cellName(p.row-1,p.col):cellName(9,p.col);const field=document.querySelector('#formula-input');if(field){field.value=`=${fn}(${from}:${to})`;field.focus();status('Проверьте диапазон, затем нажмите Enter');}break;}
 case 'copy':await copySelection();break;case 'goto':setSelection(ref);ensureVisible(parseCell(ref).row,parseCell(ref).col);break;
 case 'sheet-add':addSheet();break;case 'sheet-rename':renameSheet();break;case 'sheet-delete':deleteSheet();break;case 'sheet-select':commitEditor();book().activeSheetId=id;changed();setSelection('A1');render();break;
 }});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='file-picker'){importFile(t.files?.[0]);t.value='';}else if(t.id==='book-name'){if(!book())return;const next=t.value.trim();if(next){transact(()=>{book().name=next});}else t.value=book().name;}else if(t.id==='text-color'){applyStyle({color:t.value});}else if(t.id==='fill-color'){applyStyle({bg:t.value});}else if(t.id==='formula-input'){transact(()=>setCell(sheet(),activeCell,t.value));drawGrid();}});
app.addEventListener('keydown',e=>{if(e.target.id==='name-box'&&e.key==='Enter'){const val=e.target.value.toUpperCase().replaceAll('$',''),match=/^([A-Z]+[1-9]\d*)(?::([A-Z]+[1-9]\d*))?$/.exec(val);if(match&&parseCell(match[1])?.row<LIMITS.rows&&parseCell(match[1])?.col<LIMITS.columns){setSelection(match[1],match[2]&&parseCell(match[2])?.row<LIMITS.rows&&parseCell(match[2])?.col<LIMITS.columns?match[2]:match[1]);const p=parseCell(match[1]);ensureVisible(p.row,p.col);e.target.blur();}else status('Неверный адрес ячейки',true);}if(e.target.id==='formula-input'&&e.key==='Enter'){e.target.blur();}});
app.addEventListener('mousedown',e=>{const cell=e.target.closest('.grid-cell');if(cell){e.preventDefault();const ref=cell.dataset.ref;setSelection(e.shiftKey?activeCell:ref,ref);if(e.detail>=2){mouseSelecting=false;editCell();}else{mouseSelecting=true;document.getElementById('grid-scroll')?.focus({preventScroll:true});}}});
app.addEventListener('mouseover',e=>{if(!mouseSelecting)return;const cell=e.target.closest('.grid-cell');if(cell&&cell.dataset.ref!==rangeEnd)setSelection(activeCell,cell.dataset.ref);});
window.addEventListener('mouseup',()=>{mouseSelecting=false;});
app.addEventListener('dblclick',e=>{const cell=e.target.closest('.grid-cell');if(cell){setSelection(cell.dataset.ref);editCell();}});
async function copySelection(){if(!sheet())return false;const value=valuesTSV(sheet(),activeCell,rangeEnd);try{await navigator.clipboard.writeText(value);status('Ячейки скопированы');return true;}catch{status('Разрешите доступ к буферу или используйте Ctrl+C',true);return false;}}
window.addEventListener('paste',e=>{if(page!=='sheet'||editing)return;const t=e.target;if(t?.matches('input,textarea,[contenteditable]'))return;const text=e.clipboardData?.getData('text/plain');if(text===undefined)return;e.preventDefault();try{transact(()=>{const info=pasteTSV(sheet(),activeCell,text);rangeEnd=info.end;});setSelection(activeCell,rangeEnd);status('Вставлено из буфера обмена');}catch(err){status(err.message,true);}});
window.addEventListener('keydown',e=>{if(page!=='sheet'||!sheet())return;const t=e.target;const form=t?.matches('input,textarea,[contenteditable]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveBook();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!form){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!form){e.preventDefault();redo();return;}
 if(form)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){e.preventDefault();copySelection();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){e.preventDefault();copySelection().then(ok=>{if(ok)clearSelected();});return;}
 if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();clearSelected();return;}
 if(e.key==='F2'){e.preventDefault();editCell();return;}
 const steps={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Tab:[0,e.shiftKey?-1:1],Enter:[e.shiftKey?-1:1,0]};
 if(steps[e.key]){e.preventDefault();moveSelection(...steps[e.key],e.shiftKey&&e.key.startsWith('Arrow'));return;}
 if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();editCell(e.key);}
});
window.addEventListener('beforeunload',()=>{if(editing)commitEditor();});
render();
</script></body></html>
