name: Windows desktop SQLite
on:
  push:
    branches: [main, 'feat/task166-4-windows-sqlite']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed dependency lock
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock
          path: src-tauri/Cargo.lock
      - name: Generate Windows icon from repository script
        run: node scripts/native-icon.mjs
      - name: Rust SQLite tests
        working-directory: src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Windows x64 installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Launch and restart actual executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/quantum-office.exe"
          $data = Join-Path $env:APPDATA "com.quantumoffice.desktop/bank.sqlite3"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1"
          for ($i=0; $i -lt 2; $i++) {
            $p = Start-Process -FilePath $exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(60)
              do { Start-Sleep -Milliseconds 500; $p.Refresh() } until ($p.HasExited -or (($p.MainWindowHandle -ne 0) -and (Test-Path $data)) -or (Get-Date) -gt $deadline)
              if ($p.HasExited -or $p.MainWindowHandle -eq 0 -or !(Test-Path $data)) { throw "Desktop launch or database creation failed" }
              $header = [IO.File]::ReadAllBytes($data)
              if ([Text.Encoding]::ASCII.GetString($header,0,15) -ne "SQLite format 3") { throw "Not SQLite" }
              if ($i -eq 0) { node tests/task1664_native.cjs first } else { node tests/task1664_native.cjs second }
              if ($LASTEXITCODE -ne 0) { throw "Native WebView integration failed" }
              if ($i -eq 1) { node tests/task1664_scale.cjs; if ($LASTEXITCODE -ne 0) { throw "Native comparative benchmark failed" } }
              if (!$p.CloseMainWindow()) { throw "Window close failed" }
              if (!$p.WaitForExit(15000)) { throw "Clean close timed out" }
            } finally { if (!$p.HasExited) { Stop-Process -Id $p.Id -Force } }
          }
          New-Item -ItemType Directory -Force evidence/native | Out-Null
          @{status="PASS"; launchCount=2; database=$data; commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content evidence/native/launch.json
      - name: Package portable executable (requires WebView2)
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/x86_64-pc-windows-msvc/release/quantum-office.exe -DestinationPath Quantum-Office-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-evidence
          path: |
            evidence/native/
            src-tauri/Cargo.lock
            Quantum-Office.html
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            Quantum-Office-Windows-x64.zip
          if-no-files-found: warn
