name: Verify Quantum Office
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop source and runtime scripts
        run: |
          for file in tests/task1664*.cjs tests/task1664*.js src/core/native-drafts-bootstrap.js scripts/build.mjs; do
            node --check "$file"
          done
      - run: npm test
      - run: npm run build
      - name: Check generated native scripts
        run: |
          # WebView2 loads these as classic scripts, not ESM (package.json type=module).
          for file in dist-native/app.js dist-native/draft-bootstrap.js dist-native/print.js; do
            node --check --input-type=commonjs < "$file"
            node -e "new (require('node:vm').Script)(require('node:fs').readFileSync(process.argv[1],'utf8'),{filename:process.argv[1]})" "$file"
          done
      - name: Execute standalone native print script, not only syntax-check it
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const context={window:{},document:{body:{}}}; vm.runInNewContext(fs.readFileSync('dist-native/print.js','utf8'),context); if(typeof context.window.qwPrintReady?.then!=='function') throw Error('Native print entry point missing'); await context.window.qwPrintReady"
      - run: node -e "const fs=require('fs');if(!fs.readFileSync('dist/index.html','utf8').includes('grid-scroll'))process.exit(1)"
      # Direct HTML download; unlike the ZIP artifact this requires no extraction.
      - uses: actions/upload-artifact@v7
        with:
          path: Quantum-Office.html
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Quantum-Office-offline
          path: |
            Quantum-Office.html
            Quantum-Office.zip
          if-no-files-found: error
