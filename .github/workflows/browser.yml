name: Chromium smoke
on:
  push:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright openpyxl
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_smoke.py
      - run: python tests/xlsx_browser.py
      - run: python tests/filter_freeze_browser.py
      - run: python tests/xlsx_filter_freeze_browser.py
      - run: python tests/clipboard_browser.py
      - run: python tests/structure_browser.py
      - run: python tests/launcher_browser.py
      - run: python tests/templates_headers_browser.py
