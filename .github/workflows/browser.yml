name: Chromium smoke
on:
  push:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.56.0 openpyxl
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_smoke.py
      - run: python tests/xlsx_browser.py
      - run: python tests/filter_freeze_browser.py
      - run: python tests/xlsx_filter_freeze_browser.py
      - run: python tests/clipboard_browser.py
      - run: python tests/structure_browser.py
      - run: python tests/launcher_browser.py
      - run: python tests/templates_headers_browser.py
      - run: python tests/color_border_browser.py
      - run: python tests/color_border_xlsx_browser.py
      - run: python tests/formatting21_browser.py
      - run: python tests/merge_xlsx_browser.py
      - run: python tests/merged_clipboard_browser.py
      - run: python tests/merged_structure_browser.py
      - run: python tests/bulk_structure_browser.py
      - run: python tests/formula_conditional_browser.py
      - run: python tests/formula_sheets_browser.py

      - run: python tests/temporal_browser.py
      - run: python tests/dependency_cache_browser.py
      - run: python tests/recalculation_browser.py
      - run: python tests/formatting030_browser.py
      - run: python tests/task031_browser.py
      - run: python tests/task032_browser.py
      - run: python tests/task033_browser.py
      - run: python tests/task034_browser.py
      - run: python tests/task035_browser.py
      - run: python tests/task036_browser.py
      - run: python tests/task037_browser.py
      - run: python tests/task038_browser.py
      - run: python tests/task039_browser.py
