/* components: one owner per selector and media scope. Shared states: controls.css. */
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

input {
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--qo-focus);
  outline-offset: 2px;
}

input:focus-visible {
  outline: 2px solid var(--qo-focus);
  outline-offset: 2px;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
}

#app {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.home-main {
  flex: 1;
  overflow: auto;
  padding: 44px clamp(25px,6.6vw,112px) 24px;
  background: var(--qo-surface-alt);
}

.home-top {
  position: relative;
  padding: 4px 0 25px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .18em;
  font-weight: 850;
  color: var(--qo-muted);
}

.home-top h1 {
  font-size: clamp(42px,4.5vw,67px);
  line-height: 1.12;
  letter-spacing: -.05em;
  margin: 16px 0 13px;
  color: var(--qo-text);
}

.home-top h1 span {
  color: var(--qo-accent);
}

.home-top p {
  font-size: 15px;
  color: var(--qo-muted);
  line-height: 1.7;
  max-width: 610px;
}

.home-section {
  margin-top: 34px;
}

.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--qo-border);
  padding-bottom: 13px;
  margin-bottom: 18px;
  color: var(--qo-text);
  font-weight: 850;
  font-size: 11px;
  letter-spacing: .12em;
  gap: 16px;
}

.section-label .muted {
  font-size: 12px;
  color: var(--qo-muted);
  font-weight: 450;
  letter-spacing: 0;
}

.section-label>div {
  display: flex;
  gap: 15px;
}

.inline-action {

  color: var(--qo-accent);

  background: none;
  padding: 4px;
}

.inline-action:hover {
  text-decoration: underline;
}

.tool-cards {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 15px;
}

.tool-card {
  min-height: 210px;
  padding: 24px 23px;
  border: 1px solid var(--qo-border);
  border-radius: 15px;
  background: var(--qo-surface);
  display: flex;
  align-items: flex-start;
  flex-direction: column;
  text-align: left;
  position: relative;
  box-shadow: none;
  color: var(--qo-text);
  transition: transform .15s,box-shadow .15s;
}

.tool-card:hover {
  box-shadow: none;
}

.tool-card.live {
  border-color: var(--qo-border);
  background: var(--qo-surface-alt);
}

.tool-icon {

  height: 49px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 27px;
  margin-bottom: 16px;
}

.tool-icon.green {
  background: var(--qo-surface-alt);
  color: var(--qo-accent);
}

.tool-icon.violet {
  background: var(--qo-surface-alt);
  color: var(--qo-muted);
}

.tool-icon.orange {
  background: var(--qo-surface-alt);
  color: var(--qo-muted);
}

}

.tool-tag.muted {

.tool-card strong {

  margin-bottom: 6px;
}

.tool-card small {

  line-height: 1.5;

  color: var(--qo-muted);
}

.tool-arrow {
  position: absolute;
  right: 22px;
  bottom: 19px;
  font-size: 24px;
  color: var(--qo-muted);
}

.files-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 13px;
}

.file-card {
  border: 1px solid var(--qo-border);
  background: var(--qo-surface);
  border-radius: 12px;
  overflow: hidden;
}

}

}

}

  grid-column: 1/-1;

  justify-content: space-between;
  gap: 20px;
  font-size: 11px;
  color: var(--qo-muted);
}

.soon {

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: var(--qo-surface);

  background: var(--qo-surface-alt);

}

.soon p {

  margin-bottom: 23px;
}

.primary-btn {
  padding: 11px 16px;
  border-radius: 9px;
  background: var(--qo-accent-fill);
  color: var(--qo-on-accent);
  font-size: 12px;
  font-weight: 780;
}

.primary-btn:hover {
  background: var(--qo-hover);
}

.soft-btn {
  padding: 11px 15px;
  border-radius: 9px;
  background: var(--qo-surface-alt);
  color: var(--qo-accent);
  font-size: 12px;
  font-weight: 750;
}

.soft-btn:hover {
  background: var(--qo-hover);
}

.toast {
  position: fixed;
  bottom: 65px;
  right: 24px;
  background: var(--qo-bg);
  color: var(--qo-muted);
  z-index: 999;
  border-radius: 10px;
  padding: 14px 19px;
  font-size: 12px;
  max-width: 410px;
  box-shadow: none;
  opacity: 0;
  transform: translateY(12px);
  transition: .15s;
  pointer-events: none;
}

.toast.active {
  opacity: 1;
  transform: translateY(0);
}

.toast.bad {

/* Layout: fixed geometry shared by every editor. No document-content selectors. */
.global-bar.qo-unified-shell {
  display:grid; grid-template-columns:167px auto minmax(90px,1fr) auto;
  align-items:center; gap:8px; height:40px; min-height:40px; max-height:40px;
  padding:0 10px; flex:none; overflow:hidden; background:var(--qo-shell);
  color:var(--qo-shell-text); border-bottom:1px solid var(--qo-shell-border);
  user-select:none;
}
.qo-unified-shell .logo { display:flex; align-items:center; gap:7px; width:167px; padding:0; background:transparent; color:inherit; white-space:nowrap; text-align:left; }
.qo-unified-shell .logo-mark { width:28px; height:28px; flex:none; display:grid; place-items:center; }
.qo-unified-shell .shell-brand { width:28px; height:28px; display:block; }
.qo-unified-shell .logo-wordmark { display:flex; align-items:baseline; gap:4px; font-size:11px; letter-spacing:.025em; font-weight:650; }
.qo-unified-shell .modules { height:40px; display:flex; align-items:stretch; min-width:0; gap:1px; }
.qo-unified-shell .module { position:relative; height:40px; display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:0 11px; border:0; background:transparent; color:var(--qo-shell-muted); font:600 11px/1.2 "Segoe UI",sans-serif; white-space:nowrap; }
.qo-unified-shell .module:hover { background:var(--qo-shell-hover); color:var(--qo-shell-text); }
.qo-unified-shell .module.active { background:var(--qo-shell-hover); color:var(--qo-shell-text); }
.qo-unified-shell .module.active::after { content:""; position:absolute; bottom:0; height:2px; left:9px; right:9px; border-radius:2px; background:var(--qo-shell-accent); }
.qo-unified-shell .qo-top-icon { display:block; width:16px; height:16px; flex:none; }
.qo-unified-shell .shell-document { min-width:0; height:34px; overflow:hidden; }
.qo-unified-shell .shell-doc-wrap { width:100%; height:34px; display:grid; grid-template-rows:17px 11px; align-content:center; justify-items:center; gap:1px; padding:2px 6px; overflow:hidden; }
.qo-unified-shell :is(#book-name,.qo-shell-title-input,.qo-shell-placeholder) { width:100%; min-width:0; max-width:100%; height:17px; margin:0; padding:0 5px; border:1px solid transparent; border-radius:4px; background:transparent; color:var(--qo-shell-text); font:650 11px/15px "Segoe UI",Arial,sans-serif; text-align:center; text-overflow:ellipsis; white-space:nowrap; overflow:hidden; }
.qo-unified-shell :is(#book-name,.qo-shell-title-input):hover { background:var(--qo-shell-hover); border-color:var(--qo-shell-border); }
.qo-unified-shell .shell-save { max-width:100%; height:11px; color:var(--qo-shell-muted); font:500 8px/11px "Segoe UI",sans-serif; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }
.qo-unified-shell .global-right { display:flex; align-items:center; height:40px; gap:6px; }
.qo-unified-shell :is(.shell-action,.icon-button,.qo-theme-toggle) { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:31px; height:30px; padding:4px 8px; background:transparent; color:var(--qo-shell-text); border:1px solid var(--qo-shell-border); border-radius:var(--qo-radius); font:600 11px/1.2 "Segoe UI",sans-serif; white-space:nowrap; }
.qo-unified-shell :is(.icon-button,.qo-theme-toggle) { width:31px; padding:0; flex:none; }
.qo-unified-shell .shell-btn-icon { display:flex; width:16px; height:16px; flex:none; }
.qo-unified-shell :is(.shell-action,.icon-button,.qo-theme-toggle):hover { background:var(--qo-shell-hover); }
.qo-unified-shell .shell-action.primary { background:var(--qo-accent-fill); color:var(--qo-on-accent); border-color:transparent; }
.qo-unified-shell .shell-action.primary:hover { background:var(--qo-accent-fill-hover); }
.qo-unified-shell .shell-action.primary:active { background:var(--qo-accent-fill-pressed); }
.qo-unified-shell :is(button,input):focus-visible { outline:2px solid var(--qo-shell-text); outline-offset:-3px; }
.qo-unified-shell button:disabled { opacity:.45; cursor:default; }
@media(max-width:1230px) {
  .global-bar.qo-unified-shell { grid-template-columns:30px auto minmax(90px,1fr) auto; }
  .qo-unified-shell .logo { width:30px; }
  .qo-unified-shell .logo-wordmark { display:none; }
  .qo-unified-shell .module { padding-inline:8px; }
}
@media(max-width:800px) {
  .qo-unified-shell .module span { display:none; }
  .qo-unified-shell .module { min-width:35px; padding-inline:7px; }
  .qo-unified-shell .shell-action>span:last-child { display:none; }
  .qo-unified-shell .global-right { gap:4px; }
}
@media(max-width:550px) {
  .global-bar.qo-unified-shell { grid-template-columns:28px auto minmax(50px,1fr) auto; padding-inline:5px; gap:4px; }
  .qo-unified-shell .module { min-width:29px; padding-inline:5px; }
  .qo-unified-shell .module:first-child { font-size:9px; }
  .qo-unified-shell .shell-doc-wrap { padding-inline:0; }
}
@media print { .global-bar.qo-unified-shell { display:none; } }

.qs-layer-list { display:grid; gap:5px; }
.qs-layer-row { display:flex; gap:3px; align-items:center; min-width:0; }
.qs-layer { display:flex; align-items:center; gap:9px; height:44px; min-width:0; flex:1; padding:5px 9px; text-align:left; border:1px solid var(--qo-border); border-radius:6px; }
.qs-layer-title { font-size:11px; min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qs-layer small { font-size:10px; color:var(--qo-muted); }
.qs-layer-icon svg { width:16px; height:16px; }
.qs-layer-control { display:grid; place-items:center; height:29px; width:27px; flex:none; padding:0; border:1px solid transparent; border-radius:6px; }
.qs-layer-control svg { width:15px; height:15px; }
.qs-color-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:15px; }
.qs-color-grid button { aspect-ratio:1; border:1px solid var(--qo-border-strong); border-radius:5px; }
.qs-color-grid button[aria-pressed=true] { outline:2px solid var(--qo-focus); outline-offset:2px; }
.qs-center { grid-column:3; min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--qo-bg); }
.qs-canvas-stage { flex:1; min-height:0; overflow:auto; display:block; padding:40px 30px; background:var(--qo-bg); }
.qs-stage-inner { margin:auto; width:max-content; min-width:0; position:relative; }
.qs-stage-inner canvas { display:block; max-width:none; max-height:none; touch-action:none; cursor:crosshair; border:1px solid #c7ced8; background-color:white; background-image:conic-gradient(#f0f0f0 25%,white 0 50%,#f0f0f0 0 75%,white 0); background-size:20px 20px; box-shadow:var(--qo-artboard-shadow); color-scheme:light; }
.qs-bottom { height:38px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 12px; border-top:1px solid var(--qo-border); background:var(--qo-surface-alt); color:var(--qo-muted); font-size:11px; }
.qs-zoom { display:flex; align-items:center; gap:5px; }
.qs-zoom input { width:90px; }
.qs-zoom button { background:transparent; color:var(--qo-text); border-radius:4px; font-size:16px; }
.qs-zoom .qs-fit { font-size:10px; padding:4px 8px; border:1px solid var(--qo-border-strong); }
.qs-inspector-body { padding:14px; display:grid; gap:14px; align-content:start; }
.qs-inspector-body h4 { margin:7px 0 0; font-size:11px; font-weight:650; }
.qs-inspector-label { font-size:11px; font-weight:600; display:flex; flex-direction:column; gap:7px; }
.qs-inspector-label input:not([type=color]):not([type=range]),.qs-inspector-label textarea,.qs-dual input,.qs-studio select { width:100%; min-width:0; max-width:100%; padding:7px 8px; border:1px solid var(--qo-border-strong); border-radius:var(--qo-radius); font-size:12px; }
.qs-inspector-label input[type=color] { width:60px; height:30px; padding:2px; border:1px solid var(--qo-border-strong); border-radius:5px; background:var(--qo-surface); }
.qs-toggle { display:flex; gap:7px; align-items:center; font-size:11px; line-height:1.5; }
.qs-dual { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.qs-dual label { display:grid; gap:5px; font-size:11px; }
.qs-adjust { display:grid; grid-template-columns:1fr auto; gap:9px; font-size:11px; }
.qs-adjust input { grid-column:1/-1; width:100%; }
.qs-adjust output { color:var(--qo-accent); font-variant-numeric:tabular-nums; }
.qs-inspector-tools { flex-wrap:wrap; gap:4px; }
.qs-inspector-tools .qs-btn { flex:1; padding:5px 7px; border:1px solid var(--qo-border); font-size:10px; }
.qs-inspector-tools .qs-btn span { white-space:normal; text-align:left; }
.qs-photo-properties { display:grid; gap:12px; border-bottom:1px solid var(--qo-border); padding-bottom:16px; }
.qs-photo-properties h4 { margin:0; }
.qs-photo-properties details[open]>* { margin-top:12px; }
.qs-photo-properties summary { cursor:pointer; font-size:11px; font-weight:650; }
.qs-photo-properties .qs-original-note { font-size:10px; margin:0; line-height:1.5; }
.qs-inline-text { z-index:1000; background:#ffffffeb; color:#17253b; border:2px solid var(--qo-focus); padding:4px; box-shadow:var(--qo-shadow); resize:both; outline:none; line-height:1.25; color-scheme:light; }
@media(max-width:1250px) {
  .qs-saved-indicator { display:none; }
  .qs-left-open .qs-editor-layout { grid-template-columns:58px 220px minmax(0,1fr) 0; }
  .qs-left-open.qs-right-open .qs-editor-layout { grid-template-columns:58px 220px minmax(0,1fr) 250px; }
  .qs-toolbar-left .qs-btn span { display:none; }
}
@media(max-width:1100px) {
  .qs-studio .qs-editor-layout { grid-template-columns:58px minmax(0,1fr); }
  .qs-studio .qs-center { grid-column:2; }
  .qs-studio .qs-sidebar { position:absolute; left:58px; top:0; bottom:0; width:240px; grid-column:auto; z-index:var(--qo-z-panel); box-shadow:var(--qo-shadow); }
  .qs-studio .qs-inspector { position:absolute; right:0; top:0; bottom:0; width:260px; grid-column:auto; z-index:var(--qo-z-panel); box-shadow:var(--qo-shadow); }
  .qs-toolbar-right .qs-btn span { display:none; }
  .qs-document-size { max-width:40%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qs-zoom input { width:70px; }
}
@media(max-width:600px) {
  .qs-editor-toolbar { gap:3px; padding-inline:5px; }
  .qs-toolbar-left,.qs-toolbar-right { gap:1px; }
  .qs-editor-toolbar .qs-btn { width:28px; min-height:30px; padding:4px; }
  .qs-divider { margin-inline:2px; }
  .qs-bottom { padding-inline:7px; gap:4px; font-size:10px; }
  .qs-zoom input { width:52px; }
  .qs-studio .qs-inspector { width:min(260px,calc(100% - 64px)); }
}

function csvDecode(input) {

 * Reconciliation is called ONLY after a successful workbook transaction.
 * A changed workbook object, sheet schema, clock day or unsafe batch forces a rebuild. */



const MAX_INCREMENTAL_CHANGES=512;
const upper=name=>name.toLocaleUpperCase('ru-RU');
const signatures=book=>book.sheets.map(s=>s.id+'\u0000'+s.name).join('\u0001');
const serialToday=clock=>{
 const now=clock();
 return dateSerial(now.getFullYear(),now.getMonth()+1,now.getDate());
};

function createWorkbookRecalculator(clock=()=>new Date()){
 let current=null;
 const stats={created:0,reused:0,incremental:0,dirtyCells:0,invalidated:0,resets:0,unchanged:0};
 function reset(){
  current=null;
  stats.resets++;
 }
 function stillValid(book){
  return current && current.book===book &&
   current.signature===signatures(book) &&
   current.ctx.calculation.today===serialToday(clock);
 }
 function view(book,sheet){
  if(!book||!sheet)return null;
  if(!stillValid(book)){
   const ctx=formulaContext(book,sheet);
   // Use the same local-day boundary for memoization and TODAY calculations.
   ctx.calculation.today=serialToday(clock);
   current={book,signature:signatures(book),ctx};
   stats.created++;
  }else stats.reused++;
  const entry=current.ctx.sheets.get(upper(sheet.name));
  if(!entry)throw Error('Лист не найден в расчётном контексте');
  // The one shared session/cache is independent of the active sheet.
  return {raw:entry.cells,ctx:{...current.ctx,sheetName:sheet.name}};
 }
 /** Compare the pre-transaction workbook with its new authoritative state.
  * Style-only changes retain the session. Values changed in a bounded batch
  * invalidate reverse dependencies; large/structural edits discard the cache.
  * No result is copied from the calculation session into the workbook. */
 function reconcile(book,before){
  if(!current||current.book!==book)return {mode:'unused',changed:0};
  if(!before||before.id!==book.id||
     signatures(before)!==signatures(book)||!stillValid(book)){
   reset();return {mode:'reset',changed:0};
  }
  const changed=[];
  for(let i=0;i<book.sheets.length;i++){
   const past=before.sheets[i].cells,latest=book.sheets[i].cells,part=book.sheets[i];
   // Per-transaction scanning is bounded by the workbook's 50k-cell limit
   // and is amortized with the existing full-book Undo snapshot.
   const keys=new Set([...Object.keys(past),...Object.keys(latest)]);
   for(const ref of keys){
    const oldValue=past[ref]?.value??'',newValue=latest[ref]?.value??'';
    if(oldValue!==newValue){
     changed.push([part.name,ref,newValue]);
     if(changed.length>MAX_INCREMENTAL_CHANGES){
      reset();return {mode:'reset',changed:changed.length};
     }
    }
   }
  }
  if(!changed.length){stats.unchanged++;return {mode:'unchanged',changed:0};}
  if(!current.ctx.calculation.graphComplete){
   reset();return {mode:'reset',changed:changed.length};
  }
  try{
   let invalidated=0;
   for(const [name,ref,value] of changed)
    invalidated+=updateCalculationValue(current.ctx,name,ref,value);
   stats.incremental++;stats.dirtyCells+=changed.length;stats.invalidated+=invalidated;
   return {mode:'incremental',changed:changed.length,invalidated};
  }catch{
   // A failed or incomplete graph must never be used for future results.
   reset();return {mode:'reset',changed:changed.length};
  }
 }
 return {view,reconcile,reset,stats};
}


/** Browser File System Access operations are explicit and per-workbook.
 * The handle is session-only; never store handles in .qbook or localStorage.
 * Verification is best effort and is NOT an OS fsync or crash-durability proof. */

const DIRECT_FILE_LIMIT=15_000_000;

class DirectFileConflict extends Error {
 constructor(){super('Файл на диске изменён с момента открытия или последнего сохранения. Перезапись отменена — выберите «Сохранить как».');this.name='DirectFileConflict';}
}

async function readDirectFileText(handle){
 if(!handle||typeof handle.getFile!=='function')throw Error('Не удалось получить доступ к файлу на диске');
 const file=await handle.getFile();
 if(!file||!Number.isFinite(file.size)||file.size>DIRECT_FILE_LIMIT)throw Error('Файл превышает допустимые 15 МБ');
 const text=await file.text();
 if(typeof text!=='string')throw Error('Не удалось прочитать файл');
 return text;
}

async function openDirectQBook(handle){
 const text=await readDirectFileText(handle);
 return {book:decodeBook(text),text};
}

/** Check last read contents before writing, close and read back exactly.
 * If a writer fails, abort it where possible and leave the link's expected
 * content unchanged. No implicit download, retry or forced overwrite.
 * External writes occurring between comparison and close cannot be excluded:
 * true atomic compare-and-swap needs a tested native filesystem backend. */
async function writeVerifiedQBook(handle,expectedText,serialized){
 if(typeof expectedText!=='string'||typeof serialized!=='string')throw Error('Неверные данные сохранения');
 decodeBook(serialized);
 if(serialized.length>DIRECT_FILE_LIMIT)throw Error('Книга слишком велика для прямого сохранения');
 const existing=await readDirectFileText(handle);
 if(existing!==expectedText)throw new DirectFileConflict();
 if(typeof handle.createWritable!=='function')throw Error('Нет разрешения на запись в файл');
 const writer=await handle.createWritable();
 try{
  await writer.write(serialized);
  await writer.close();
 }catch(error){
  if(typeof writer.abort==='function')try{await writer.abort();}catch{ /* retain original error */ }
  throw error;
 }
 const actual=await readDirectFileText(handle);
 if(actual!==serialized)throw Error('После записи файл отличается от книги. Проверьте файл и сохраните резервную копию — успех не подтверждён.');
 return serialized;
}

  const table=cell.closest('table');

  const para=document.createElement('p');para.append(document.createElement('br'));table.after(divider,para);
  const range=document.createRange();range.setStart(para,0);range.collapse(true);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);

function qoWriterCell(){

function qoWriterTableAction(action){
 const cell=qoWriterCell(),table=cell?.closest('table');
 if(!cell||!table){status('Сначала установите курсор внутрь ячейки таблицы',true);return;}
 const row=cell.closest('tr'),rows=[...table.rows],index=[...row.cells].indexOf(cell);
 if(action==='writer-add-row'){
  const newRow=row.cloneNode(false);for(const c of row.cells){const next=document.createElement(c.tagName.toLowerCase());next.append(document.createElement('br'));newRow.append(next);}row.after(newRow);
 }else if(action==='writer-add-col'){
  if(rows.some(r=>r.cells.length>=12)){status('Максимум 12 столбцов',true);return;}
  for(const r of rows){const el=document.createElement(r.closest('thead')?'th':'td');el.append(document.createElement('br'));r.cells[Math.min(index,r.cells.length-1)]?.after(el)||r.append(el);}
 }else if(action==='writer-delete-row'){
  if(rows.length<=1){table.remove();}else row.remove();
 }else if(action==='writer-delete-table'){table.remove();}
 qoWriterSelectionRange=null;qoPersistWriter();
}

async function qoSlidesExportPNG(){
 const slide=qoSlide(),canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;
 const ctx=canvas.getContext('2d');ctx.fillStyle=slide.bg||'#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
 for(const item of slide.items){
  const x=canvas.width*item.x/100,y=canvas.height*item.y/100,w=canvas.width*item.w/100,h=canvas.height*item.h/100;
  if(item.kind==='shape'){ctx.fillStyle=/^#[0-9a-f]{6}$/i.test(item.fill||'')?item.fill:'#2c9569';ctx.fillRect(x,y,w,h);continue;}
  if(item.kind==='image'){
   try{const img=await new Promise((resolve,reject)=>{const a=new Image();a.onload=()=>resolve(a);a.onerror=reject;a.src=item.data;});
   const fit=Math.min(w/img.naturalWidth,h/img.naturalHeight);ctx.drawImage(img,x+(w-img.naturalWidth*fit)/2,y+(h-img.naturalHeight*fit)/2,img.naturalWidth*fit,img.naturalHeight*fit);}catch{}continue;
  }
  ctx.fillStyle=item.color||'#213d30';ctx.font=`${item.bold?'bold ':''}${Math.max(10,Number(item.size)||20)*1.38}px "Segoe UI",Arial,sans-serif`;
  ctx.textAlign=item.align||'left';ctx.textBaseline='top';
  const sx=item.align==='center'?x+w/2:item.align==='right'?x+w:x;
  for(const [lineNo,line] of String(item.text||'').split('\n').entries())ctx.fillText(line,sx,y+lineNo*(Math.max(10,Number(item.size)||20)*1.55),w);
 }
 await new Promise(resolve=>canvas.toBlob(blob=>{if(blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${safeFile(qoSlides.name)}_${qoSlides.active+1}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}resolve();},'image/png'));
}

 // A whole-sheet selection is a compact default-dimension change, not 100k per-row writes.
 if(selectedRects().some(a=>a.r1===0&&a.r2===LIMITS.rows-1&&a.c1===0&&a.c2===LIMITS.columns-1))
  return ['all'];
 const full=kind==='col'?LIMITS.rows-1:LIMITS.columns-1,which=kind==='col'?'c':'r';
 const selected=selectedRects().filter(a=>kind==='col'?
  a.r1===0&&a.r2===full:a.c1===0&&a.c2===full);
 const contains=selected.some(a=>kind==='col'?
  index>=a.c1&&index<=a.c2:index>=a.r1&&index<=a.r2);
 if(!contains)return [index];

 for(const a of selected)for(let j=a[which+'1'];j<=a[which+'2'];j++){
  indices.add(j);if(indices.size>500)throw Error('За один раз можно изменить не более 500 строк или столбцов');

     value>(kind==='row'&&targets[0]==='all'?DIMENSIONS.maxDefaultRow:kind==='row'?DIMENSIONS.maxRow:DIMENSIONS.maxColumn))

/** Every drag is one Undo transaction; preview positions are never persisted until release. */
function startChartPointerDrag(e){
 if(e.button!==0||!sheet()||!book()||resizeDrag)return;
 const handle=e.target.closest('[data-chart-drag],[data-chart-resize]');
 if(!handle)return;
 const id=handle.dataset.chartDrag||handle.dataset.chartResize,chart=(sheet().charts||[]).find(c=>c.id===id);
 if(!chart)return;
 e.preventDefault();e.stopPropagation();mouseSelecting=false;commitEditor();
 const layout=chartLayout(sheet(),chart,(sheet().charts||[]).indexOf(chart));
 const element=[...document.querySelectorAll('.qo-sheet-chart')].find(node=>node.dataset.id===id);
 chartDrag={id,sheetId:sheet().id,kind:handle.dataset.chartResize?'resize':'move',originX:e.clientX,originY:e.clientY,
  initial:layout,next:layout,element,moved:false};
 selectedChartId=id;
}
function previewChartPointerDrag(e){
 if(!chartDrag||!sheet()||sheet().id!==chartDrag.sheetId)return;
 const d=chartDrag,dx=Math.round(e.clientX-d.originX),dy=Math.round(e.clientY-d.originY);
 if(Math.abs(dx)+Math.abs(dy)<2&&!d.moved)return;
 const {x,y}=gridGeometry(sheet()),maxX=x.at(-1),maxY=y.at(-1)-headerH;
 const v={...d.initial};
 if(d.kind==='move'){
  v.x=Math.max(rowW,Math.min(maxX-v.width,v.x+dx));
  v.y=Math.max(0,Math.min(maxY-v.height,v.y+dy));
 }else{
  v.width=Math.max(CHART_MIN_WIDTH,Math.min(1000,maxX-v.x,v.width+dx));
  v.height=Math.max(CHART_MIN_HEIGHT,Math.min(700,maxY-v.y,v.height+dy));
 }
 d.next=v;d.moved=Object.keys(v).some(k=>v[k]!==d.initial[k]);
 if(d.element){
  d.element.style.left=v.x+'px';d.element.style.top=v.y+'px';
  d.element.style.width=v.width+'px';d.element.style.height=v.height+'px';
 }
 e.preventDefault();
}
function finishChartPointerDrag(commit){
 const d=chartDrag;chartDrag=null;
 if(!d||!commit||!d.moved||sheet()?.id!==d.sheetId)return;
 try{transact(()=>changeChart(sheet(),d.id,{layout:d.next}));refreshSheetCharts();status('Положение диаграммы сохранено (Ctrl+Z — отменить)');}
 catch(err){refreshSheetCharts();status(err.message,true);}
}
function createSelectedChart(type){if(!requireSingleRange())return;

  let c;transact(()=>{c=addChart(book(),sheet(),type,source.from,source.to);});
  selectedChartId=c.id;chartDrawerOpen=true;render();
  status(source.mode==='empty'?'Пустая диаграмма создана: заполните категории и числа или измените источник данных.':
    source.mode==='detected'?'Диаграмма создана: редактор автоматически нашёл соседние данные.':
    'Диаграмма создана и связана с выбранными ячейками.');
 }catch(err){status(err.message||'Диаграмма не создана',true);}
}



function applyChartManualData(text){
 const chart=(sheet()?.charts||[]).find(c=>c.id===selectedChartId);if(!chart)throw Error('Диаграмма не выбрана');
 const raw=String(text||'').replace(/\u00a0/g,' ').trim();
 if(!raw)throw Error('Введите данные для диаграммы');
 const rows=raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
  const parts=line.includes('\t')?line.split('\t'):line.includes(';')?line.split(';'):line.split(',');
  return parts.map(v=>v.trim());
 });
 if(!rows.length)throw Error('Нет данных для вставки');
 const start=parseCell(chart.from);if(!start)throw Error('Некорректная стартовая ячейка диаграммы');
 const width=Math.max(...rows.map(r=>r.length));
 const from=cellName(start.row,start.col),to=cellName(start.row+rows.length-1,start.col+width-1);
 transact(()=>{
  rows.forEach((row,r)=>row.forEach((value,c)=>setTypedCell(sheet(),cellName(start.row+r,start.col+c),value)));
  changeChart(sheet(),selectedChartId,{from,to});
 });
 render();
 status('Данные вставлены в лист и привязаны к диаграмме');
}

 <h3>Фильтр</h3><p>Фильтр временно скрывает строки, которые не соответствуют выбранным значениям или условиям. Данные остаются в ячейках и не удаляются. Условия по разным столбцам действуют одновременно.</p>
 <p><b>Применение:</b> выделяется диапазон вместе с заголовками → «Данные» → «Автофильтр» → стрелка в заголовке столбца → выбор значений → «Показать выбранные».</p>
 <p><b>Сброс:</b> «Сбросить этот столбец» или «Сбросить все фильтры».</p>
 <h3>Умная таблица</h3><p>Умная таблица — прямоугольный список с заголовком и одной записью в каждой строке. При вводе в первой строке под таблицей диапазон расширяется; оформление и формулы продолжаются.</p>
 <p><b>Создание:</b> выделяется весь список, включая заголовки → «Данные» → «Создать». Повторяющиеся названия столбцов разрешены. Допускается таблица из одного столбца.</p>
 <p><b>Расширение:</b> существующая умная таблица может быть расширена новым выделением, полностью содержащим её исходный диапазон. При расширении условия фильтра сбрасываются.</p>
 <h3>Ограничения</h3><p>Одна умная таблица на листе. Вложенные таблицы не создаются. Объединённые ячейки внутри диапазона не поддерживаются. Для отдельных списков используются разные листы.</p>
 <h3>Выбор диапазона</h3><p>Для сортировки записей вместе с контактами, ссылками и оценками выделяются все связанные столбцы. Выделение одного столбца не перемещает соседние данные.</p>
 <h3>Сохранение</h3><p>QBOOK сохраняет структуру умной таблицы. XLSX сохраняет данные, оформление, формулы и автофильтр, но не создаёт полноценный объект Excel Table.</p>
