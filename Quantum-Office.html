/* Sheets compact ribbon 2026-10-28: screen space belongs to the grid.
   Tool labels remain accessible via aria-label/title; groups use two tight rows. */
.compact-shell{height:40px;min-height:40px;padding:0 10px;gap:12px}
.compact-shell .logo{min-width:151px;gap:7px;font-size:10px;letter-spacing:.025em;white-space:nowrap}
.compact-shell .logo-mark{width:25px;height:25px;font-size:17px;border-radius:6px}
.compact-shell .modules{gap:0;flex:0 0 auto;min-width:0}
.compact-shell .module{font-size:11px;padding:0 10px;font-weight:630}
.compact-shell .shell-document{display:flex;align-items:center;min-width:110px;flex:1;gap:7px;justify-content:center;overflow:hidden}
.compact-shell #book-name{min-width:0;max-width:210px;flex:1;background:transparent;border:1px solid transparent;padding:3px 5px;border-radius:4px;color:#fff;font-size:11px;font-weight:670;text-overflow:ellipsis;text-align:right}
.compact-shell #book-name:hover,.compact-shell #book-name:focus{border-color:#587263;background:#1b3040;outline:0}
.compact-shell .shell-save{font-size:9px;color:#92c3ac;white-space:nowrap}
.compact-shell .global-right{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.compact-shell .shell-action{background:transparent;color:#d9e6dd;font-size:11px;padding:5px 7px;border-radius:4px;white-space:nowrap}
.compact-shell .shell-action.primary{background:#2c835e;color:white}
.compact-shell .shell-action:hover{background:#346f55}
.compact-shell .icon-button{width:27px;height:27px;border-radius:4px}
.ribbon{background:#fafbfc;border-bottom:1px solid #d5dce3;box-shadow:0 1px 2px #1d2d4011}
.ribbon-tabs{height:29px;display:flex;gap:1px;border-bottom:1px solid #e0e6eb;padding:0 8px;background:#f9fafb}
.ribbon-tabs button{padding:0 10px;font-size:11px;color:#627183;font-weight:600;line-height:29px;border-radius:0}
.ribbon-tabs button:hover{background:#e9f0ed;color:#23553e}
.ribbon-tabs button.chosen{color:#176840;background:#fff;font-weight:730}
.ribbon-tabs button.chosen:after{height:2px;left:8px;right:8px;background:#2c875b;bottom:0}
.ribbon-controls{min-height:73px;height:73px;display:flex;align-items:stretch;gap:0;padding:3px 6px 2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.ribbon-group{height:68px;min-height:0;padding:2px 9px 0;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:0;flex:none;margin:0;border-right:1px solid #dde3e7}
.ribbon-group:first-child{padding-left:3px}
.ribbon-group-content{height:48px;flex:1;min-height:0;display:grid;grid-template-rows:repeat(2,23px);grid-auto-flow:column;grid-auto-columns:max-content;align-content:center;align-items:center;column-gap:3px;row-gap:1px}
.ribbon-group .group-name{position:static;text-align:center;padding:2px 2px 0;color:#7e8997;letter-spacing:0;font-size:9px;font-weight:600;line-height:13px}
.ribbon-group button.tool-btn{min-width:26px;max-width:155px;height:23px;padding:1px 5px;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;border-radius:3px;border:1px solid transparent;background:transparent;color:#364354;font-weight:560;font-size:10px}
.ribbon-group button.tool-btn:hover{background:#e7f0e9;border-color:#bfd9c7;color:#155f3f}
.ribbon-group button.tool-btn:active{background:#d6e6db}
.ribbon-group button.tool-btn .tool-symbol{width:20px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:#2c6c4d;background:none;border:0}
.ribbon-group button.tool-btn .tool-symbol b,.ribbon-group button.tool-btn .tool-symbol i{font-size:13px}
.ribbon-group button.tool-btn .tool-label{display:none;white-space:nowrap}
.ribbon-group button.tool-btn.is-labeled .tool-label{display:inline;font-size:10px}
.ribbon-color{width:30px;height:23px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:3px;cursor:pointer;position:relative}
.ribbon-color:hover{background:#e9f2ed}
.ribbon-color span{font-size:12px;font-weight:800;line-height:14px}

.ribbon-color input::-webkit-color-swatch-wrapper{padding:0}
.ribbon-color input::-webkit-color-swatch{border:0;border-radius:0}
.ribbon-help{font-size:10px;color:#798696;align-self:center;margin:0 12px;white-space:nowrap}

.find-bar label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#345b48}
.find-bar input{height:27px;min-width:110px;width:175px;padding:4px 7px;background:white;border:1px solid #bed3c5;border-radius:4px;font-size:11px}
.find-bar button{height:27px;padding:3px 8px;background:#fff;color:#1c6747;border:1px solid #bdd3c4;border-radius:4px;font-size:10px}
.find-bar button:hover{background:#e1eee5}
.find-bar button:last-child{font-size:17px;padding:0 8px}
.formula-line{height:30px}
.formula-line #name-box{width:92px;font-size:11px}
.formula-line .fx-symbol{font-size:14px;padding:0 9px}
.formula-line #formula-input{font-size:11px}
.sheet-footer{height:32px}
.sheet-tab,.sheet-menu,.sheet-options{font-size:10px;padding:0 10px}
.sheet-status{font-size:10px;gap:12px}

@media(max-width:730px){.global-bar.compact-shell{height:39px;min-height:39px;display:flex;flex-wrap:nowrap;align-content:center;gap:3px;padding:0 4px}.compact-shell .logo{min-width:25px;height:30px;flex:0 0 25px}.compact-shell .modules{height:39px;width:auto;min-width:0;order:initial;flex:1;overflow-x:auto}.compact-shell .module{font-size:10px;padding:0 6px}.compact-shell .shell-document{display:none}.compact-shell .global-right{height:30px}.ribbon-tabs{padding:0 3px;overflow-x:auto}.ribbon-tabs button{padding:0 7px}.ribbon-controls{height:73px;min-height:73px;padding:3px}.ribbon-group{height:67px;padding:2px 6px 0}.sheet-footer{height:32px}}

/* Resize grips are narrow and only visible on hover; no large ribbon controls. */
.colhead,.rowhead{position:absolute;overflow:visible}
.grid-resizer{position:absolute;z-index:8;display:block;touch-action:none;background:transparent}
.col-resizer{right:-4px;top:0;bottom:0;width:9px;cursor:col-resize}
.row-resizer{bottom:-4px;left:0;right:0;height:9px;cursor:row-resize}
.grid-resizer:hover{background:#2f947755}
.is-resizing,.is-resizing *{user-select:none!important;cursor:col-resize!important}

/* Sheet visibility & frozen panes. Compact controls remain unchanged. */
.sheet-page{position:relative}
.grid-cell.frozen-row,.grid-cell.frozen-col{z-index:7;background-color:#fff}
.grid-cell.frozen-row.frozen-col{z-index:9}
.grid-cell.is-selected.frozen-row,.grid-cell.is-selected.frozen-col{background:#e8f5ed}
.rowhead.frozen-row,.colhead.frozen-col{z-index:15;background:#f3f7fa}
.filter-head{position:absolute;right:2px;top:3px;width:20px;height:20px;border:1px solid #bed6c6;border-radius:3px;color:#216a49;background:#e4f3e9;cursor:pointer;z-index:2}
.filter-head:hover{background:#b9dfc6}
.grid-cell:has(.filter-head){padding-right:25px}
.filter-popup{position:absolute;right:12px;top:110px;z-index:180;min-width:245px;max-width:300px;background:#fff;border:1px solid #b8cfc0;box-shadow:0 9px 28px #16352233;border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:9px;color:#24384a;font-size:11px}
.filter-popup-head,.filter-popup-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
.filter-popup label{display:flex;flex-direction:column;gap:5px}
.filter-popup select{border:1px solid #bdcfc5;border-radius:4px;padding:6px;max-width:100%;background:#fff;color:#24384a}
.filter-popup button{padding:5px 8px;color:#235b3d;border:1px solid #d4e5d9;background:#f1f8f3;border-radius:4px}
.filter-popup small{color:#708194;line-height:1.4}

/* Multi-value filtering: accessible, compact list without enlarging ribbon. */
.filter-popup .filter-bulk{display:flex;align-items:center;gap:4px}
.filter-popup .filter-choices{display:flex;flex-direction:column;gap:1px;max-height:220px;overflow:auto;border:1px solid #e0e7e2;background:#fcfefd;border-radius:4px;padding:4px}
.filter-popup .filter-choices label{display:flex;align-items:center;flex-direction:row;gap:7px;min-height:25px;padding:2px 5px;cursor:pointer}
.filter-popup .filter-choices label:hover{background:#eaf4ed}
.filter-popup .filter-choices input{accent-color:#218056;flex:none;margin:0}
.filter-popup .filter-choices span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Desktop-first: the tool chrome is not an editable document. Browser text selection
   must stay inside form inputs or cell editing, never highlight the whole ribbon. */
.global-bar,.ribbon,.ribbon-tabs,.ribbon-controls,.sheet-footer,.grid-scroll,.grid-canvas,
.global-bar *, .ribbon *, .sheet-footer *, .grid-scroll *{
 -webkit-user-select:none;user-select:none;
}
.global-bar input,.ribbon input,.formula-line input,.cell-editor,.find-bar input,
.global-bar textarea,.ribbon textarea{-webkit-user-select:text;user-select:text}
.ribbon-group .tool-symbol svg{width:16px;height:16px;display:block;stroke:currentColor}
/* Mouse clicks must not leave sticky browser focus styling on the ribbon.
   Keyboard focus remains visible for accessibility. */
.ribbon-tabs button:focus:not(:focus-visible),.tool-btn:focus:not(:focus-visible),
.module:focus:not(:focus-visible){outline:none;box-shadow:none}

/* Minimal application launcher: no marketing headings, three tools only. */
.office-launcher{background:#f5f7fa;padding:clamp(22px,4.5vw,56px) clamp(22px,6vw,110px);}
.launcher-tools{width:min(1120px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.launcher-tile{min-height:220px;padding:24px 21px 21px;border:1px solid #dce4ea;background:white;border-radius:15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:8px;box-shadow:0 2px 9px #142a3510;transition:transform .12s,border-color .12s,box-shadow .12s;color:#263449;}
.launcher-tile:hover{transform:translateY(-2px);box-shadow:0 11px 28px #142a3520;border-color:#96bfad;}
.launcher-tile:focus-visible{outline:3px solid #318d61;outline-offset:3px;}
.launcher-art{width:72px;height:74px;display:grid;place-items:center;margin-bottom:8px;}
.launcher-art svg{width:72px;height:72px;}
.launcher-name{font-weight:760;font-size:21px;letter-spacing:-.02em;}
.launcher-description{font-size:12px;color:#788698;}
.launcher-state{font-size:10px;color:#8190a1;margin-top:auto;}
.launcher-state.available{color:#207a50;}
.launcher-quick{width:min(1120px,100%);margin:24px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.launcher-quick-action{background:#fff;display:flex;align-items:center;gap:12px;border:1px solid #e0e7ed;border-radius:9px;padding:13px 15px;text-align:left;color:#33455b;min-width:0;}
.launcher-quick-action:hover{background:#edf5f0;border-color:#a8cfb8;}
.launcher-quick-action svg{width:30px;height:30px;flex:none;}.launcher-quick-action .quick-glyph{font-size:24px;line-height:30px;color:#328660;width:30px;text-align:center;}
.launcher-quick-action span:last-child{display:flex;flex-direction:column;gap:3px;min-width:0;}
.launcher-quick-action strong{font-size:12px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.launcher-quick-action small{font-size:10px;color:#8391a1;}
.launcher-files{width:min(1120px,100%);margin:38px auto 0;}
.launcher-files-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:#55677c;margin-bottom:13px;}
.launcher-files-top button{background:none;color:#2b8056;font-size:11px;}
.launcher-note{width:min(1120px,100%);margin:25px auto;color:#8e9ba9;font-size:10px;}
.sheet-tab-editor{background:white;color:#174e3a;outline:2px solid #288959;border:0;border-radius:3px;min-width:85px;max-width:170px;width:130px;height:27px;padding:2px 7px;font-size:11px;}
@media(max-width:850px){.launcher-tools,.launcher-quick{gap:9px;}.launcher-tile{min-height:190px;padding:17px}.launcher-name{font-size:17px}.launcher-quick-action{padding:10px;gap:8px}}
@media(max-width:590px){.launcher-tools{grid-template-columns:1fr;gap:9px}.launcher-tile{min-height:100px;display:grid;grid-template-columns:60px 1fr;gap:4px 10px;align-items:center}.launcher-art{grid-row:span 3;margin:0;width:60px;height:60px}.launcher-art svg{height:60px;width:60px}.launcher-quick{grid-template-columns:1fr;gap:7px}.launcher-files{margin-top:22px}}

/* TASK 019 — stable, viewport-anchored table headers. Never scroll the header DOM with cells. */
.grid-frame{position:relative;display:flex;flex:1;min-height:90px;min-width:0;overflow:hidden}
.grid-frame>.grid-scroll{flex:1;min-height:0;height:100%;width:100%}
.grid-col-overlay{position:absolute;top:0;left:54px;right:0;height:31px;overflow:hidden;z-index:40;background:#f2f5f9;pointer-events:auto}
.grid-row-overlay{position:absolute;top:31px;bottom:0;left:0;width:54px;overflow:hidden;z-index:39;background:#f2f5f9;pointer-events:auto}
.grid-col-overlay .colhead,.grid-row-overlay .rowhead{cursor:pointer;z-index:1;white-space:nowrap;user-select:none}
.grid-col-overlay .colhead:hover,.grid-row-overlay .rowhead:hover{background:#d9ecdf;color:#216846}
.grid-col-overlay .header-selected,.grid-row-overlay .header-selected{background:#d5ebdf;color:#17613e}
.grid-corner-fixed{position:absolute;top:0;left:0;width:54px;height:31px;background:#e7edef;border-right:1px solid #cbd9d0;border-bottom:1px solid #cbd9d0;z-index:43;cursor:pointer}
.grid-corner-fixed:after{content:'';position:absolute;bottom:7px;right:8px;width:0;height:0;border-style:solid;border-width:0 0 10px 10px;border-color:transparent transparent #648577 transparent}
.grid-corner-fixed:hover{background:#d9ebdd}
.grid-col-overlay .colhead.frozen-col,.grid-row-overlay .rowhead.frozen-row{z-index:2;background:#e4ede8}
.grid-col-overlay .grid-resizer,.grid-row-overlay .grid-resizer{z-index:4}
/* Home module template entries are deliberate separate actions beneath three editor tiles. */
.launcher-template-actions{width:min(1120px,100%);margin:11px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.launcher-template-actions button{border:1px solid #d9e7e0;background:#eef7f2;color:#226446;text-align:left;min-height:41px;padding:10px 15px;border-radius:9px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.launcher-template-actions button:hover{background:#dcf0e3;border-color:#8bc6a4}
.launcher-secondary{width:min(1120px,100%);margin:15px auto 0;display:flex;justify-content:flex-end;gap:10px}
.launcher-secondary button{font-size:11px;color:#336f50;background:transparent;padding:7px 10px;border-radius:5px}
.launcher-secondary button:hover{background:#e7efe9}
.templates-page{flex:1;min-height:0;overflow:auto;background:#f5f7fa;padding:40px clamp(20px,6vw,95px)}
.templates-heading{max-width:1150px;margin:0 auto 28px}.templates-back{background:transparent;color:#268258;font-size:12px;margin-bottom:25px;font-weight:700}
.templates-heading h1{font-size:27px;margin:0 0 7px;color:#1a2d40}.templates-heading p{font-size:12px;color:#77879a;margin:0}
.templates-grid{max-width:1150px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.template-card{display:flex;flex-direction:column;text-align:left;gap:10px;padding:18px;min-height:170px;background:white;border:1px solid #e0e7eb;border-radius:12px;color:#24364a}
.template-card:hover:not(:disabled){border-color:#84c7a0;box-shadow:0 5px 15px #233b4220}
.template-card:disabled{opacity:.63;cursor:not-allowed}.template-card-art{background:#e8f5ed;color:#27845b;width:42px;height:42px;display:grid;place-items:center;border-radius:8px;font-size:23px}
.template-card strong{font-size:15px}.template-card small{font-size:11px;color:#8190a0;line-height:1.5}
.template-card-arrow,.template-card-muted{font-size:11px;color:#25734d;font-weight:700;margin-top:auto}
@media(max-width:590px){.launcher-template-actions{grid-template-columns:1fr;gap:7px}.launcher-secondary{flex-wrap:wrap;justify-content:flex-start}}

/* Explicit text wrapping, without changing the compact ribbon height. */
.grid-cell.is-wrapped{white-space:pre-wrap;overflow-wrap:anywhere;align-items:flex-start;padding-top:4px;line-height:17px;text-overflow:clip;}

/* TASK 021 — dense Excel-like formatting menus. Popovers never alter grid geometry. */
.ribbon{position:relative;z-index:20;overflow:visible}
.format-popover{position:absolute;z-index:210;top:calc(100% - 3px);left:116px;min-width:218px;background:#fff;border:1px solid #cedbd3;border-radius:8px;padding:10px;box-shadow:0 13px 32px #0b223733;color:#243b32;font-size:12px}
.popup-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px}
.popup-header button{background:transparent;color:#6b7783;font-size:20px;line-height:1;width:24px;height:24px;border-radius:4px}
.palette-grid{display:grid;grid-template-columns:repeat(8,22px);gap:4px}
.palette-swatch{width:22px;height:22px;border:1px solid #aab4be;border-radius:3px;outline-offset:1px}
.palette-swatch:hover,.palette-swatch:focus-visible{outline:2px solid #2a9565}
.palette-custom{display:flex;align-items:center;gap:9px;margin-top:11px;padding-top:9px;border-top:1px solid #e4e9ed}
.palette-custom label{font-weight:650;white-space:nowrap}.palette-custom input{height:28px;width:38px;cursor:pointer;padding:0;border:0;background:none}
.palette-custom button{margin-left:auto;background:#f1f5f3;border-radius:4px;padding:5px;font-size:11px}
.border-popover{left:365px;width:230px;padding:6px}
.border-choice{display:flex;align-items:center;gap:10px;width:100%;height:32px;background:transparent;text-align:left;padding:4px 9px;border-radius:4px;font-size:12px;color:#243f30}
.border-choice:hover{background:#e6f3eb}
.border-glyph{display:flex;width:23px;height:23px;align-items:center;justify-content:center;color:#267650}
.border-glyph svg{width:17px;height:17px}
.grid-cell.is-merged{z-index:5;overflow:hidden;display:flex;align-items:center}
.grid-cell.is-merged.is-selected{z-index:6}
.grid-cell.is-merged.frozen-row,.grid-cell.is-merged.frozen-col{z-index:12}
@media(max-width:660px){.format-popover{left:8px;max-width:calc(100vw - 24px)}.border-popover{left:8px}}
.ribbon{z-index:1000}

function updateSelectionStats(){const node=document.querySelector('#selection-stats');if(!node||!sheet())return;const rect=rectangle(activeCell,rangeEnd);if(!rect)return;const n=(rect.r2-rect.r1+1)*(rect.c2-rect.c1+1);if(n>10000){node.textContent=`Выделено: ${n} ячеек`;return;}const raw=rawMap(sheet());let count=0,sum=0;for(let r=rect.r1;r<=rect.r2;r++)for(let c=rect.c1;c<=rect.c2;c++){const value=resultOf(sheet(),cellName(r,c),raw);const number=Number(value);if(value!==''&&Number.isFinite(number)){count++;sum+=number;}}node.textContent=count?`Чисел: ${count} · Сумма: ${Number(sum.toFixed(8))} · Среднее: ${Number((sum/count).toFixed(8))}`:`Выделено: ${n}`;}
function structuralAction(axis,mode){
 commitEditor();if(!sheet())return;
 const pos=parseCell(activeCell);if(!pos)return;
 const index=axis==='row'?pos.row:pos.col;
 try{
  const draft=structuredClone(sheet());
  changeSheetStructure(draft,axis,mode,index); // Validate before adding undo history.
  transact(()=>changeSheetStructure(sheet(),axis,mode,index));
  const next=mode==='delete'?Math.min(index,axis==='row'?LIMITS.rows-2:LIMITS.columns-2):index;
  const dest=axis==='row'?cellName(next,pos.col):cellName(pos.row,next);
  filterColumn=null;internalClipboard=null;setSelection(dest);render();status(`${mode==='insert'?'Вставлен':'Удалён'} ${axis==='row'?'ряд':'столбец'} ${index+1}`);
 }catch(err){status(err.message||'Операция отклонена',true);}
}
function visibilityAction(axis,show){
 commitEditor();const s=sheet();if(!s)return;
 const p=parseCell(activeCell);if(!p)return;
 try{
  const index=axis==='row'?p.row:p.col;
  if(show){const key=axis==='row'?'hiddenRows':'hiddenColumns';const count=Object.keys(s[key]||{}).length;
   if(!count){status('Скрытых строк или столбцов нет');return;}
   transact(()=>showAllHidden(s,axis));render();status(`Отображено: ${count}`);return;
  }
  if(axis==='row'&&!rowVisible(s,index)||axis==='col'&&!columnVisible(s,index))throw Error('Уже скрыто');
  const trial=structuredClone(s);setHidden(trial,axis,index,true);
  transact(()=>setHidden(s,axis,index,true));
  // Switch to a visible cell without modifying the hidden contents.
  const next=(n,limit,visible)=>{for(let i=n+1;i<limit;i++)if(visible(i))return i;for(let i=n-1;i>=0;i--)if(visible(i))return i;return -1;};
  const rr=axis==='row'?next(index,LIMITS.rows,r=>rowVisible(s,r)):p.row;
  const cc=axis==='col'?next(index,LIMITS.columns,c=>columnVisible(s,c)):p.col;
  if(rr>=0&&cc>=0){activeCell=cellName(rr,cc);rangeEnd=activeCell;}
  render();status(`Скрыт ${axis==='row'?'ряд':'столбец'} ${index+1}`);
 }catch(err){status(err.message||'Не удалось скрыть',true);}
}
function applyStyle(patch,selection=null){
 const a=selection?.start||activeCell,b=selection?.end||rangeEnd;
 // A color picker may dispatch change only after focus moved to another cell.
 // Do not ever apply a stale snapshot to a different document or worksheet.
 if(selection&&(selection.bookId!==book()?.id||selection.sheetId!==sheet()?.id)){status('Исходный лист изменился — выберите цвет заново',true);return;}
 const rect=rectangle(a,b);if(!rect||!sheet())return;
 for(let r=rect.r1;r<=rect.r2;r++)if(!rowVisible(sheet(),r)){status('Выделение содержит скрытые строки',true);return;}
 const refs=refsBetween(a,b);if(refs.length>10000){status('Слишком большой диапазон',true);return;}
 transact(()=>{for(const ref of refs)setStyle(sheet(),ref,patch);});drawGrid();
}

  render();status(mode==='merge'?'Ячейки объединены':'Объединение снято');
 }catch(err){status(err.message,true);}
}

function toggleWrap(){const next=!getCell(sheet(),activeCell).style?.wrap;const rect=rectangle(activeCell,rangeEnd);if(!rect||refuseHiddenSelection())return;
 const refs=refsBetween(activeCell,rangeEnd);if(refs.length>10000){status('Слишком большой диапазон',true);return;}
 transact(()=>{for(const ref of refs)setStyle(sheet(),ref,{wrap:next});
  // Expand rows only when needed; never shrink a user-defined custom height.
  if(next){for(let r=rect.r1;r<=rect.r2;r++){let need=rowHeight(sheet(),r);for(let c=rect.c1;c<=rect.c2;c++){
    const content=displayedValue(sheet(),cellName(r,c)),charsPerLine=Math.max(5,Math.floor((columnWidth(sheet(),c)-16)/7));
    const count=String(content).split('\n').reduce((n,line)=>n+Math.max(1,Math.ceil(line.length/charsPerLine)),0);
    need=Math.max(need,Math.min(DIMENSIONS.maxRow,Math.max(DIMENSIONS.minRow,count*17+8)));
   } if(need>rowHeight(sheet(),r))setRowHeight(sheet(),r,need);}}
 });drawGrid();}

function nextMatch(){if(!sheet()||!searchTerm.trim()){status('Введите текст для поиска',true);return;}
 const refs=findCells(sheet(),searchTerm);if(!refs.length){status('Совпадений нет',true);return;}
 const current=refs.indexOf(activeCell);findIndex=(current+1)%refs.length;
 const ref=refs[findIndex];setSelection(ref);const pos=parseCell(ref);ensureVisible(pos.row,pos.col);status(`Найдено ${refs.length} · ${findIndex+1} из ${refs.length}`);}

 status(count?`Заменено в ${count} ячейках (формулы не изменены)`:'Совпадений для замены нет');

function addSheet(){const b=book();if(!b)return;if(b.sheets.length>=LIMITS.sheets){status('Лимит: 25 листов');return;}
 let n=1;const names=new Set(b.sheets.map(s=>s.name.toLocaleLowerCase('ru-RU')));while(names.has(`лист ${n}`))n++;
 const name=`Лист ${n}`;transact(()=>{const s=newSheet(name);b.sheets.push(s);b.activeSheetId=s.id;});setSelection('A1');render();status(`Создан новый лист «${name}»`);}

function renameSheet(id=sheet()?.id){const b=book(),s=b?.sheets.find(x=>x.id===id);if(!s)return;
 const tab=[...document.querySelectorAll('.sheet-tab')].find(x=>x.dataset.id===id);if(!tab)return;
 const input=document.createElement('input');input.className='sheet-tab-editor';input.setAttribute('aria-label','Новое имя листа');input.maxLength=31;input.value=s.name;let settled=false;
 const finish=cancel=>{if(settled)return;settled=true;const next=input.value.trim();
  if(!cancel&&next&&next!==s.name){if(/[\\/*?:\[\]]/.test(next)||b.sheets.some(x=>x.id!==id&&x.name.toLowerCase()===next.toLowerCase()))status('Название листа недопустимо или уже существует',true);
   else transact(()=>{s.name=next});}
  render();};
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(false);}if(e.key==='Escape'){e.preventDefault();finish(true);}e.stopPropagation();});
 input.addEventListener('blur',()=>finish(false));tab.replaceWith(input);input.focus();input.select();}

function deleteSheet(){const b=book();if(b.sheets.length<=1){status('Нельзя удалить единственный лист');return;}if(!confirm(`Удалить лист «${sheet().name}»?`))return;const id=b.activeSheetId;transact(()=>{b.sheets=b.sheets.filter(s=>s.id!==id);b.activeSheetId=b.sheets[0].id;});setSelection('A1');render();}

  case 'text-palette':case 'fill-palette':recordColorSelection();activePalette=action==='text-palette'?'color':'bg';borderMenuOpen=false;render();break;

function captureSelection(){if(!sheet()||refuseHiddenSelection())return null;const rect=rectangle(activeCell,rangeEnd);if(rect&&(rect.r2-rect.r1+1)*(rect.c2-rect.c1+1)>10000){status('Копирование ограничено 10 000 ячеек',true);return null;}try{internalClipboard=copyCells(sheet(),activeCell,rangeEnd);return internalClipboard;}catch(error){status(error.message,true);return null;}}
async function copySelection(){const clip=captureSelection();if(!clip)return false;
 try{await navigator.clipboard.writeText(clip.text);status('Скопировано');}catch{status('Скопировано внутри Quantum Sheets (буфер браузера недоступен)');}
 return true;}
function pasteIntoCells(text,clip=null){if(!sheet()||refuseHiddenSelection())return false;
 try{
  if(!clip&&typeof text!=='string')throw Error('Буфер обмена пуст');
  if(!clip&&text.length===0)throw Error('Буфер обмена пуст');
  let info;transact(()=>{info=clip?pasteCells(sheet(),activeCell,clip):pasteTSV(sheet(),activeCell,text);});
  setSelection(activeCell,info.end);status(`Вставлено: ${info.rows} × ${info.cols}`);return true;
 }catch(error){status(error.message||'Вставка не выполнена',true);return false;}
}
// Clipboard events handle external data. In-app keyboard copy/paste also works on file:// without Clipboard API permissions.
window.addEventListener('copy',e=>{

 if(e.clipboardData){e.preventDefault();e.clipboardData.setData('text/plain',clip.text);status('Скопировано');}
});
window.addEventListener('paste',e=>{

});

});
